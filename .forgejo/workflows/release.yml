name: Release

# Cross-compiles the Windows DLL on a Linux runner (MSVC ABI via clang-cl and
# xwin) and publishes it as a Forgejo release on every merge to main.
on:
  push:
    branches: [ main ]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  WINEDEBUG: "-all"

jobs:
  build-and-release:
    runs-on: docker
    timeout-minutes: 60
    container:
      # clang 19, lld, cmake, ninja and Wine preinstalled. The job adds the
      # MSVC CRT/Windows SDK from xwin and the small missing tools.
      image: messense/cargo-xwin:0.23.1
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends lld jq unzip nodejs
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Prepare MSVC cross toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          
          ln -sf /usr/bin/clang /usr/local/bin/clang-cl
          ln -sf /usr/bin/llvm-lib /usr/local/bin/llvm-lib
          ln -sf /usr/bin/llvm-rc /usr/local/bin/llvm-rc
          ln -sf "$(command -v lld-link || command -v lld-link-19)" /usr/local/bin/lld-link
          
          if [[ ! -d /xwin/crt/include ]]; then
              xwin_version=0.10.0
              xwin_prefix="xwin-${xwin_version}-x86_64-unknown-linux-musl"
              curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/${xwin_version}/${xwin_prefix}.tar.gz" \
                  | tar -xz -C /usr/local/bin --strip-components=1 "${xwin_prefix}/xwin"
              xwin --accept-license --cache-dir /root/.xwin-cache splat --output /xwin
              rm -rf /root/.xwin-cache
          fi
          
          clang-cl --version | head -1
          lld-link --version

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          
          # A monotonic counter keeps every merge to main publishable without
          # having to bump a file. The tag is created by the release below.
          version="v0.${{ github.run_number }}"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "Tag $version already exists. Delete that release/tag before re-running this workflow." >&2
              exit 1
          fi
          
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Publishing $version (previous tag: ${previous:-none})"

      - name: Generate changelog
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh \
              '${{ steps.version.outputs.version }}' \
              release-notes.md \
              '${{ steps.version.outputs.previous }}' \
              '${{ github.server_url }}/${{ github.repository }}'
          cat release-notes.md

      - name: Fetch dependencies
        run: bash scripts/fetch-deps.sh

      - name: Build DLL
        run: bash scripts/build-linux.sh

      - name: Run tests
        run: ctest --test-dir build-linux --output-on-failure

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
              echo "GITHUB_TOKEN is unavailable; make sure Forgejo Actions is enabled for this repository." >&2
              exit 1
          fi
          
          version='${{ steps.version.outputs.version }}'
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          auth="Authorization: token ${GITHUB_TOKEN}"
          
          payload="$(jq -n \
              --arg tag "$version" \
              --arg target '${{ github.sha }}' \
              --arg name "CrossGhost $version" \
              --rawfile body release-notes.md \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')"
          
          release="$(curl -fsS -X POST \
              -H "$auth" -H 'Content-Type: application/json' \
              -d "$payload" "$api/releases")"
          release_id="$(jq -r '.id' <<<"$release")"
          
          curl -fsS -X POST -H "$auth" \
              -F "attachment=@dist/CrossGhost.dll" \
              "$api/releases/${release_id}/assets?name=CrossGhost.dll" >/dev/null
          
          echo "Published $version: $(jq -r '.html_url' <<<"$release")"
          sha256sum dist/CrossGhost.dll
